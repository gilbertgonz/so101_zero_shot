[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101_zero_shot"
version = "0.1.0"
description = "Zero-shot language-conditioned grasping on the SO-101 with a wrist fisheye camera"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "feetech-servo-sdk>=1.0",
    "pyserial>=3.5",
    "placo>=0.9",
    "pyyaml>=6.0",
    "huggingface_hub>=0.30",
    "pillow>=10",
    "scipy>=1.11",
    "pyarrow>=15",
]

[project.optional-dependencies]
sim = ["mujoco>=3.1"]
# Phase 2 perception. torch: install the CUDA build, e.g. --index-url https://download.pytorch.org/whl/cu126
perception = ["torch>=2.5", "transformers>=4.57", "accelerate>=1.0"]
# 4-/8-bit VLM loading (perception.vlm_quantization)
quant = ["bitsandbytes>=0.45"]
# Multi-view depth: what the MVSAnywhere clone imports (see README "Depth")
multiview = ["kornia==0.6.7", "loguru>=0.7", "antialiased-cnns>=0.3", "efficientnet_pytorch>=0.7", "lightning>=2.2",
             "timm>=1.0", "einops>=0.8"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]
