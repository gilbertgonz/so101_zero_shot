<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SO-101 zero-shot robot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #4f8cff; --ok: #39c07f; --warn: #f0b429; --bad: #ef5350; --ghost: #00dcff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  .chip { padding: 2px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: #2c5a45; } .chip.bad { color: var(--bad); border-color: #6a2f2f; }
  .chip.warn { color: var(--warn); border-color: #6b5420; }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 14px; padding: 14px; height: calc(100vh - 52px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .left { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .feed { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .feed .imgwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
  .feed img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .mapwrap { position: absolute; inset: 0; display: none; background: #0b0d11; }
  .mapwrap.show { display: block; }
  .mapwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mapwrap canvas.gl { cursor: grab; } .mapwrap canvas.gl:active { cursor: grabbing; }
  .mapwrap canvas.labels { pointer-events: none; }
  .maptools { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; }
  .maptools .seg { margin-left: 0; background: rgba(0,0,0,.55); }
  .maptools button.small { background: rgba(0,0,0,.55); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .mapinfo { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); max-width: 70%; }
  .mapinfo b { color: var(--text); font-weight: 600; }
  .mapempty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; pointer-events: none; }
  .overlay { position: absolute; left: 12px; top: 12px; background: rgba(0,0,0,.65); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  .overlay .live { color: var(--bad); font-weight: 700; margin-right: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .seg button.on { background: var(--panel2); color: var(--text); }
  .controls { display: flex; gap: 10px; padding: 12px; align-items: center; }
  .controls input[type=text] { flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; outline: none; }
  .controls input[type=text]:focus { border-color: var(--accent); }
  button.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.btn:disabled { opacity: .4; cursor: not-allowed; }
  .run { background: var(--accent); color: white; } .stop { background: var(--warn); color: #1b1300; }
  .estop { background: var(--bad); color: white; letter-spacing: .04em; }
  label.keep { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .right { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .robot img { width: 100%; display: block; background: #0b0d10; aspect-ratio: 4/3; }
  .joints { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 8px 10px; font-size: 11px; color: var(--muted); text-align: center; }
  .joints b { display: block; color: var(--text); font-size: 13px; font-weight: 600; }
  .steps { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .steplist { overflow: auto; flex: 1; padding: 6px 0; }
  .step { padding: 7px 12px; border-left: 3px solid transparent; cursor: pointer; }
  .step:hover { background: var(--panel2); }
  .step .row { display: flex; align-items: center; gap: 10px; }
  .step .icon { width: 18px; text-align: center; font-weight: 700; }
  .step .label { flex: 1; }
  .step .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .step .msg { color: var(--muted); font-size: 12px; margin: 2px 0 0 28px; white-space: pre-wrap; }
  .step.sub { padding-left: 30px; font-size: 13px; }
  .agentbtn { background: #1fa37a; color: white; }
  .dialog p { white-space: pre-wrap; }
  .step.pending { color: var(--muted); } .step.active { border-left-color: var(--accent); background: #1a2233; }
  .step.done .icon { color: var(--ok); } .step.failed .icon, .step.failed .msg { color: var(--bad); }
  .step.stopped .icon, .step.stopped .msg { color: var(--warn); } .step.skipped { color: var(--muted); }
  .detail { margin: 6px 0 4px 28px; font-size: 12px; }
  .detail table { border-collapse: collapse; width: 100%; }
  .detail td { padding: 2px 6px 2px 0; vertical-align: top; } .detail td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
  .thumbs { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .thumbs img { height: 70px; border-radius: 4px; border: 1px solid var(--line); cursor: zoom-in; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .log { max-height: 130px; overflow: auto; font: 12px/1.4 ui-monospace, monospace; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); }
  .result { font-weight: 700; } .result.held { color: var(--ok); } .result.missed, .result.bad { color: var(--bad); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal.show { display: flex; }
  .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; max-width: 92vw; max-height: 92vh; overflow: auto; }
  .dialog h3 { margin: 0 0 6px; } .dialog p { color: var(--muted); margin: 0 0 12px; }
  .dialog .imgs { display: flex; gap: 12px; align-items: flex-start; }
  .dialog .imgs img { max-height: 62vh; max-width: 44vw; border-radius: 6px; border: 1px solid var(--line); }
  .dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .approve { background: var(--ok); color: #04130b; } .cancel { background: var(--panel2); color: var(--text); border: 1px solid var(--line) !important; }
  .reasoning { flex: 0 0 32%; min-height: 170px; display: flex; flex-direction: column; }
  .reasoning h2 .name { text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 400; margin-left: auto; }
  .rlog { overflow: auto; flex: 1; padding: 6px 12px 10px; font-size: 13px; }
  .rlog .empty { color: var(--muted); padding: 6px 0; }
  .r { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid #1f232c; }
  .r .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
  .r .v { white-space: pre-wrap; overflow-wrap: anywhere; }
  .r.plan .v { background: var(--panel2); border-left: 3px solid var(--accent); padding: 6px 8px; border-radius: 4px; font: 12.5px/1.45 ui-monospace, monospace; }
  .r.call .v { font: 12.5px/1.4 ui-monospace, monospace; color: #8fb6ff; }
  .r.result .v { color: var(--muted); } .r.result.bad .v { color: var(--bad); }
  .r.check .v { color: var(--warn); } .r.reply .v { color: var(--muted); font-style: italic; }
  .r.finished .v, .r.refused .v { font-weight: 600; }
  .r.thinking .v { color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 8px; }
  .pickbtn { background: #7c5cff; color: white; }
  .controls.quick { opacity: 0.85; }
  .controls.quick .btn { font-size: 0.85em; }
  .quicklabel { color: var(--muted, #888); font-size: 0.85em; }
  .steplist .empty { color: var(--muted, #888); padding: 12px 4px; line-height: 1.5; }
  .imgwrap.picking { outline: 3px solid #7c5cff; outline-offset: -3px; }
  .imgwrap.picking img { cursor: crosshair; }
  .banner { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #7c5cff; color: white;
            padding: 8px 16px; border-radius: 999px; font-weight: 600; display: none; max-width: 80%; text-align: center; }
  .imgwrap.picking .banner { display: block; }
  .clickmark { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 3px solid #ff3b6b;
               border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.6); pointer-events: none; display: none; }
  .neutral { background: var(--panel2); color: var(--text); border: 1px solid var(--line) !important; }
</style>
</head>
<body>
<header>
  <h1>SO-101 zero-shot robot</h1>
  <span class="chip" id="chip-models">models</span>
  <span class="chip" id="chip-arm">arm</span>
  <span class="chip" id="chip-camera">camera</span>
  <span class="chip" id="chip-torque">torque</span>
  <span class="chip warn" id="chip-env" style="display:none"></span>
  <span class="spacer"></span>
  <span id="result" class="result"></span>
</header>

<main>
  <section class="left">
    <div class="card feed">
      <h2>Wrist camera
        <span class="seg" id="camview">
          <button data-v="rect" class="on">Straightened</button><button data-v="raw">Raw fisheye</button><button data-v="map" title="The robot's 3D map of the table, built from the depth of every photo it takes">3D map</button>
        </span>
      </h2>
      <div class="imgwrap">
        <img id="cam" src="/stream/camera.mjpg?view=rect" alt="camera">
        <div class="mapwrap" id="mapwrap">
          <canvas class="gl" id="mapgl"></canvas>
          <canvas class="labels" id="maplabels"></canvas>
          <div class="mapempty" id="mapempty">No map yet. The robot builds it from the depth of its photos during a run (Ask, or a quick grasp).</div>
          <div class="maptools">
            <span class="seg" id="mapcolor"><button data-v="rgb" class="on" title="Colours the camera saw">Colour</button><button data-v="height" title="Height above the table, blue (0) to red (10 cm and up)">Height</button></span>
            <button class="small" id="mapreset" title="Back to the view from behind the robot (also: double-click)">Reset view</button>
          </div>
          <div class="mapinfo" id="mapinfo"></div>
        </div>
        <div class="overlay"><span class="live">LIVE</span><span id="overlay-step">idle</span></div>
        <div class="banner" id="banner"></div>
        <div class="clickmark" id="clickmark"></div>
      </div>
      <div class="controls">
        <input id="prompt" type="text" placeholder='Ask the robot to do something ("knock over the blue cylinder", "put the red cube next to the yellow ball")' autocomplete="off">
        <button class="btn agentbtn" id="agentbtn" title="The robot looks around, makes a plan, then carries it out">Ask</button>
        <label class="keep" title="Save this run as an episode (camera frames + robot state + outcome)"><input type="checkbox" id="record"> record</label>
        <label class="keep" title="Ask before acting: the plan, each grasp, moving near a hand. Off: the robot goes ahead without asking."><input type="checkbox" id="approval"> require approval</label>
        <button class="btn stop" id="stop" title="Hold, then return to rest. Press again while returning to cut torque where it is.">Stop</button>
        <button class="btn estop" id="estop" title="Disable torque immediately: the arm drops onto its stops.">E-STOP</button>
      </div>
      <div class="controls quick">
        <span class="quicklabel" title="Shortcuts that skip the planning: the classic grasp pipeline">Quick grasp:</span>
        <button class="btn run" id="run" title="Find the object named in the box and grasp it (no planning)">Grasp named object</button>
        <button class="btn pickbtn" id="pickbtn" title="Move to the scan pose, then click the object in the camera view">Grasp by clicking</button>
        <label class="keep"><input type="checkbox" id="keep"> keep holding</label>
      </div>
      <div class="controls" id="simcontrols" style="display:none">
        <span class="chip warn">MuJoCo simulation</span>
        <button class="btn" id="simreset" title="Objects back to their starting places, arm to rest">Reset scene</button>
        <button class="btn" id="simshuffle" title="Objects moved up to 3 cm and turned at random, arm to rest">Shuffle objects</button>
      </div>
    </div>
    <div class="card reasoning">
      <h2>Model reasoning <span class="name" id="reasoner"></span></h2>
      <div class="rlog" id="rlog"></div>
    </div>
  </section>

  <section class="right">
    <div class="card robot">
      <h2>Arm (live)
        <span class="seg" id="robotview">
          <button data-v="3/4" class="on">3/4</button><button data-v="side">Side</button><button data-v="top">Top</button><button data-v="front">Front</button>
        </span>
      </h2>
      <img id="robot" src="/stream/robot.mjpg" alt="robot">
      <div class="joints" id="joints"></div>
    </div>
    <div class="card steps">
      <h2>Steps <span id="query" style="text-transform:none;letter-spacing:0;color:var(--text)"></span></h2>
      <div class="steplist" id="steps"></div>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>

<div class="modal" id="confirm">
  <div class="dialog">
    <h3 id="confirm-title">Approve?</h3>
    <p id="confirm-prompt"></p>
    <div class="imgs" id="confirm-imgs"></div>
    <div class="actions" id="confirm-actions"></div>
  </div>
</div>
<div class="modal lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const JOINTS = ["pan", "lift", "elbow", "w.flex", "w.roll", "grip %"];
const ICON = { pending: "○", done: "✓", failed: "✗", stopped: "■", skipped: "–" };
const expanded = new Set();
let state = null, confirmId = null;

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok) { const t = await r.text(); alert(`${url}: ${t}`); }
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtVal(v) {
  if (Array.isArray(v)) return v.length ? v.map(fmtVal).join(", ") : "none";
  if (typeof v === "boolean") return v ? "yes" : "no";
  return esc(v);
}
function chip(id, label, value) {
  const el = $(id); el.textContent = `${label}: ${value}`;
  el.className = "chip " + (String(value).startsWith("ok") || value === "on" ? "ok" : String(value).startsWith("error") ? "bad" : "warn");
  el.title = value;
}
function elapsed(st) {
  if (!st.t0) return "";
  const end = st.t1 || Date.now() / 1000;
  return `${(end - st.t0).toFixed(1)} s`;
}

function render(s) {
  state = s;
  chip("chip-models", "models", s.status.models);
  chip("chip-arm", "arm", s.status.arm);
  chip("chip-camera", "camera", s.status.camera);
  chip("chip-torque", "torque", s.torque ? "on" : "off");
  $("chip-torque").className = "chip " + (s.torque ? "warn" : "ok");
  $("chip-env").style.display = s.environment === "real" ? "none" : "";
  $("chip-env").textContent = s.environment === "sim" ? "SIMULATION" : "FAKE (saved image)";
  $("simcontrols").style.display = s.environment === "sim" ? "" : "none";
  $("simreset").disabled = $("simshuffle").disabled = s.busy;

  const ready = s.status.models === "ok" && String(s.status.arm).startsWith("ok") && String(s.status.camera).startsWith("ok");
  $("run").disabled = s.busy || !ready;
  $("pickbtn").disabled = s.busy || !ready;
  $("agentbtn").disabled = s.busy || !ready;
  $("stop").disabled = !s.busy;
  $("prompt").disabled = s.busy;
  $("record").checked = !!s.recording;
  $("record").disabled = s.busy;
  $("approval").checked = !!s.require_approval;
  $("query").textContent = s.query ? (s.mode === "agent" ? `"${s.query}"` : `grasp: "${s.query}"`)
    : (s.mode === "click" && (s.busy || s.result) ? "(grasp by clicking)" : "");
  const wrap = document.querySelector(".imgwrap");
  wrap.classList.toggle("picking", !!s.pick);
  if (s.pick && $("mapwrap").classList.contains("show")) setCamView(camView);  // the click goes on the camera
  $("banner").textContent = s.pick ? s.pick.prompt : "";
  if (!s.busy) $("clickmark").style.display = "none";

  const res = $("result");
  res.textContent = s.busy ? "running..." : (s.result ? `last result: ${s.result}` : "");
  const good = s.result === "held" || String(s.result).startsWith("done");
  res.className = "result " + (good ? "held" : (s.result ? "bad" : ""));

  const active = s.steps.find(x => x.status === "active");
  $("overlay-step").textContent = s.thinking ? `model thinking: ${s.thinking}...`
    : (active ? active.label : (s.busy ? "working..." : "idle"));

  if (s.joints_deg) {
    const vals = [...s.joints_deg, s.gripper_pct];
    $("joints").innerHTML = vals.map((v, i) => `<div>${JOINTS[i]}<b>${v == null ? "-" : Number(v).toFixed(1)}</b></div>`).join("");
  }

  $("steps").innerHTML = s.steps.length ? "" : `<div class="empty">Ask the robot for anything. It looks around,
    makes a plan, and each step it takes shows up here.</div>`;
  if (s.steps.length) $("steps").innerHTML = s.steps.map(st => {
    const icon = st.status === "active" ? '<span class="spin"></span>' : (ICON[st.status] || "○");
    const open = expanded.has(st.id) || st.status === "active" || st.status === "failed";
    const det = Object.entries(st.detail || {});
    const body = open && (det.length || st.images.length) ? `
      <div class="detail">
        ${det.length ? `<table>${det.map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td>${fmtVal(v)}</td></tr>`).join("")}</table>` : ""}
        ${st.images.length ? `<div class="thumbs">${st.images.map(u => `<img src="${u}" data-full="${u}">`).join("")}</div>` : ""}
      </div>` : "";
    return `<div class="step ${st.status}${String(st.id).includes(".") ? " sub" : ""}" data-id="${st.id}">
      <div class="row"><span class="icon">${icon}</span><span class="label">${esc(st.label)}</span><span class="time">${elapsed(st)}</span></div>
      ${st.message ? `<div class="msg">${esc(st.message)}</div>` : ""}${body}</div>`;
  }).join("");

  renderReasoning(s);

  const log = $("log"); const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.innerHTML = s.logs.map(esc).join("<br>");
  if (atBottom) log.scrollTop = log.scrollHeight;

  if (s.confirm && s.confirm.id !== confirmId) {
    confirmId = s.confirm.id;
    $("confirm-title").textContent = s.confirm.title || "Confirm";
    $("confirm-actions").innerHTML = (s.confirm.options || []).map(o => {
      const cls = ["yes", "grasp"].includes(o.value) ? "approve" : (["no", "cancel"].includes(o.value) ? "cancel" : "neutral");
      return `<button class="btn ${cls}" data-v="${esc(o.value)}">${esc(o.label)}</button>`;
    }).reverse().join("");
    $("confirm-prompt").textContent = s.confirm.prompt;
    $("confirm-imgs").innerHTML = s.confirm.images.map(u => `<img src="${u}">`).join("");
    $("confirm").classList.add("show");
  } else if (!s.confirm && confirmId) {
    confirmId = null; $("confirm").classList.remove("show");
  }
}

const RKIND = { plan: "plan", thought: "thinks", call: "calls", result: "robot", check: "check", reply: "replied",
                refused: "refuses", finished: "finished" };
let reasoningKey = "";
function renderReasoning(s) {
  $("reasoner").textContent = s.reasoner || "";
  const items = s.reasoning || [];
  const key = items.length + "|" + (s.thinking || "") + "|" + s.mode;
  if (key === reasoningKey) return;  // unchanged: keep the scroll position and any selection
  reasoningKey = key;
  const box = $("rlog"), atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
  if (!items.length && !s.thinking) {
    box.innerHTML = `<div class="empty">${s.mode === "agent" || !s.query
      ? "The model's plan, what it is thinking at each step, the tool it calls and what the robot reports back show up here."
      : "Quick grasps run without the reasoning model."}</div>`;
    return;
  }
  box.innerHTML = items.map(r => {
    const bad = r.kind === "result" && r.text.startsWith("FAILED");
    if (r.kind === "thought" && !r.text.trim()) return "";
    return `<div class="r ${r.kind}${bad ? " bad" : ""}"><div class="k">${RKIND[r.kind] || r.kind}</div><div class="v">${esc(r.text)}</div></div>`;
  }).join("") + (s.thinking ? `<div class="r thinking"><div class="k">model</div><div class="v"><span class="spin"></span>thinking: ${esc(s.thinking)}...</div></div>` : "");
  if (atBottom || s.thinking) box.scrollTop = box.scrollHeight;
}

$("steps").addEventListener("click", (e) => {
  const img = e.target.closest("img[data-full]");
  if (img) { $("lightbox-img").src = img.dataset.full; $("lightbox").classList.add("show"); return; }
  const step = e.target.closest(".step"); if (!step) return;
  const id = step.dataset.id; expanded.has(id) ? expanded.delete(id) : expanded.add(id);
  if (state) render(state);
});
$("lightbox").addEventListener("click", () => $("lightbox").classList.remove("show"));
$("run").addEventListener("click", () => post("/api/run", { query: $("prompt").value, keep: $("keep").checked }));
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("agentbtn").disabled) $("agentbtn").click(); });
$("stop").addEventListener("click", () => post("/api/stop"));
$("estop").addEventListener("click", () => post("/api/estop"));
$("record").addEventListener("change", (e) => post("/api/recording", { enabled: e.target.checked }));
$("approval").addEventListener("change", (e) => post("/api/approval", { enabled: e.target.checked }));
$("simreset").addEventListener("click", () => post("/api/sim/reset", { shuffle: false }));
$("simshuffle").addEventListener("click", () => post("/api/sim/reset", { shuffle: true }));
$("confirm-actions").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]");
  if (b && confirmId) post("/api/confirm", { id: confirmId, answer: b.dataset.v });
});
$("pickbtn").addEventListener("click", () => post("/api/run", { mode: "click", keep: $("keep").checked }));
$("agentbtn").addEventListener("click", () => post("/api/run", { mode: "agent", query: $("prompt").value }));
let camView = "rect";
$("cam").addEventListener("click", (e) => {
  if (!state || !state.pick) return;
  const img = $("cam"), r = img.getBoundingClientRect();
  // object-fit: contain -> the picture may be letterboxed inside the element
  const s = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  const x0 = r.left + (r.width - w) / 2, y0 = r.top + (r.height - h) / 2;
  const fx = (e.clientX - x0) / w, fy = (e.clientY - y0) / h;

  m.style.left = `${e.clientX - wr.left}px`; m.style.top = `${e.clientY - wr.top}px`; m.style.display = "block";

document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("lightbox").classList.remove("show"); });
$("camview").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setCamView(b.dataset.v); });
for (const [segId, handler] of [["robotview", v => post("/api/robot_view", { view: v })]]) {
  $(segId).addEventListener("click", (e) => {

// ------------------------------------------------------------------ 3D map tab
// The robot's map (perception/scene_map.py) as a point cloud, plus the listed objects (boxes with their
// numbers), the arm's skeleton and the table grid. Base frame in cm: x forward, y left, z up. Plain WebGL.
const map3d = (() => {
  const glc = $("mapgl"), lc = $("maplabels"), wrap = $("mapwrap");
  const gl = glc.getContext("webgl", { antialias: true });
  const ctx = lc.getContext("2d");
  const HOME = { az: Math.PI + 0.35, el: 0.55, dist: 80, target: [18, 0, 9] };  // from behind, like the wrist camera
  let cam = { ...HOME, target: [...HOME.target] };
  let active = false, version = "", npts = 0, colorMode = 0, data = null, timer = null, dirty = false;
  if (!gl) { $("mapempty").textContent = "This browser has no WebGL, so the 3D map cannot be shown."; return { show() {}, hide() {} }; }

  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; };
  const ptsProg = prog(`
    attribute vec3 pos; attribute vec3 col; uniform mat4 mvp; uniform float ps; uniform int mode; varying vec3 c;
    void main() {
      gl_Position = mvp * vec4(pos, 1.0);
      gl_PointSize = clamp(ps / gl_Position.w, 1.5, 9.0);
      float t = clamp(pos.z / 10.0, 0.0, 1.0);
      vec3 h = vec3(clamp(1.5 - abs(4.0*t - 3.0), 0.0, 1.0), clamp(1.5 - abs(4.0*t - 2.0), 0.0, 1.0),
                    clamp(1.5 - abs(4.0*t - 1.0), 0.0, 1.0));

    }`, `precision mediump float; varying vec3 c; void main() { gl_FragColor = vec4(c, 1.0); }`);
  const lineProg = prog(`attribute vec3 pos; attribute vec3 col; uniform mat4 mvp; uniform float ps; varying vec3 c;
    void main() { gl_Position = mvp * vec4(pos, 1.0); gl_PointSize = ps; c = col; }`,
    `precision mediump float; varying vec3 c; void main() { gl_FragColor = vec4(c, 1.0); }`);
  const ptsPos = gl.createBuffer(), ptsCol = gl.createBuffer(), linBuf = gl.createBuffer(), dotBuf = gl.createBuffer();
  let nLines = 0, nDots = 0;

  // column-major 4x4 helpers
  const persp = (fovy, asp, n, f) => { const t = 1 / Math.tan(fovy / 2);
    return [t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0]; };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map(v => v / l); };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const lookAt = (e, t, up) => { const f = norm(sub(t, e)), s = norm(cross(f, up)), u = cross(s, f);
    return [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, e), -dot(u, e), dot(f, e), 1]; };
  const mul = (a, b) => { const o = new Array(16).fill(0);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k];
    return o; };
  const eye = () => [cam.target[0] + cam.dist * Math.cos(cam.el) * Math.cos(cam.az),
                     cam.target[1] + cam.dist * Math.cos(cam.el) * Math.sin(cam.az),
                     cam.target[2] + cam.dist * Math.sin(cam.el)];
  const FOV = 45 * Math.PI / 180;

  // static scene parts + objects + arm -> line list and dot list (x y z r g b per vertex)
  function buildOverlay() {
    const L = [], D = [];
    const line = (a, b, c) => { L.push(...a, ...c, ...b, ...c); };
    const grid = [0.22, 0.25, 0.3];
    for (let x = 0; x <= 45; x += 5) line([x, -30, 0], [x, 30, 0], grid);
    for (let y = -30; y <= 30; y += 5) line([0, y, 0], [45, y, 0], grid);
    const ws = [0.35, 0.45, 0.6];  // reach: x 10-32, y -20..20
    [[10, -20], [32, -20], [32, 20], [10, 20]].forEach((p, i, a) => line([...p, 0.05], [...a[(i + 1) % 4], 0.05], ws));
    line([0, 0, 0], [6, 0, 0], [0.94, 0.33, 0.31]); line([0, 0, 0], [0, 6, 0], [0.22, 0.75, 0.5]);
    line([0, 0, 0], [0, 0, 6], [0.31, 0.55, 1]);
    for (const o of (data && data.objects) || []) {
      const [cx, cy] = o.center_cm, top = Math.max(o.top_cm, 0.5);
      const col = o.kind === "hand" ? [0.94, 0.33, 0.31] : (o.held ? [0, 0.86, 1] : [0.94, 0.71, 0.16]);
      const a = norm([o.axis[0], o.axis[1], 0]), p = [-a[1], a[0], 0], hl = o.length_cm / 2, hw = o.width_cm / 2;
      const corner = (i, z) => { const sl = (i === 0 || i === 3) ? -1 : 1, sw = i < 2 ? -1 : 1;
        return [cx + a[0] * hl * sl + p[0] * hw * sw, cy + a[1] * hl * sl + p[1] * hw * sw, z]; };
      const z0 = o.held ? top - Math.max(2, o.width_cm) : 0;
      for (let i = 0; i < 4; i++) { const j = (i + 1) % 4;
        line(corner(i, z0), corner(j, z0), col); line(corner(i, top), corner(j, top), col); line(corner(i, z0), corner(i, top), col); }
    }
    const arm = (data && data.arm) || [];
    for (let i = 1; i < arm.length; i++) line(arm[i - 1], arm[i], [0.9, 0.9, 0.95]);
    arm.forEach((p, i) => D.push(...p, ...(i === arm.length - 1 ? [0, 0.86, 1] : [0.9, 0.9, 0.95])));
    gl.bindBuffer(gl.ARRAY_BUFFER, linBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(L), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, dotBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(D), gl.DYNAMIC_DRAW);
    nLines = L.length / 6; nDots = D.length / 6;
  }

  function setPoints(b64pts, b64cols) {
    const raw = Uint8Array.from(atob(b64pts), ch => ch.charCodeAt(0));
    const mm = new Int16Array(raw.buffer, 0, raw.length / 2), pos = new Float32Array(mm.length);
    for (let i = 0; i < mm.length; i++) pos[i] = mm[i] / 10;  // mm -> cm
    const col = Uint8Array.from(atob(b64cols), ch => ch.charCodeAt(0));
    npts = pos.length / 3;
    gl.bindBuffer(gl.ARRAY_BUFFER, ptsPos); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, ptsCol); gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
  }

  function attrib(p, name, buf, size, type, normalized, stride, offset) {
    const loc = gl.getAttribLocation(p, name); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, type, normalized, stride, offset);
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1, w = Math.round(wrap.clientWidth * dpr), h = Math.round(wrap.clientHeight * dpr);
    if (!w || !h) return;
    for (const c of [glc, lc]) if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    gl.viewport(0, 0, w, h); gl.clearColor(0.043, 0.051, 0.067, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    const mvp = mul(persp(FOV, w / h, 1, 500), lookAt(eye(), cam.target, [0, 0, 1]));
    const focal = h / (2 * Math.tan(FOV / 2));
    if (npts) {
      gl.useProgram(ptsProg);
      attrib(ptsProg, "pos", ptsPos, 3, gl.FLOAT, false, 0, 0); attrib(ptsProg, "col", ptsCol, 3, gl.UNSIGNED_BYTE, true, 0, 0);
      gl.uniformMatrix4fv(gl.getUniformLocation(ptsProg, "mvp"), false, mvp);
      gl.uniform1f(gl.getUniformLocation(ptsProg, "ps"), 0.6 * focal);  // a 5 mm voxel, a little enlarged
      gl.uniform1i(gl.getUniformLocation(ptsProg, "mode"), colorMode);
      gl.drawArrays(gl.POINTS, 0, npts);
    }
    gl.useProgram(lineProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(lineProg, "mvp"), false, mvp);
    for (const [buf, n, prim, ps] of [[linBuf, nLines, gl.LINES, 1], [dotBuf, nDots, gl.POINTS, 7 * dpr]]) {
      if (!n) continue;
      attrib(lineProg, "pos", buf, 3, gl.FLOAT, false, 24, 0); attrib(lineProg, "col", buf, 3, gl.FLOAT, false, 24, 12);
      gl.uniform1f(gl.getUniformLocation(lineProg, "ps"), ps);
      gl.drawArrays(prim, 0, n);
    }
    // labels
    ctx.clearRect(0, 0, w, h);
    const proj = (p) => { const v = [0, 1, 2, 3].map(r => mvp[r] * p[0] + mvp[4 + r] * p[1] + mvp[8 + r] * p[2] + mvp[12 + r]);
      return v[3] > 0 ? [(v[0] / v[3] + 1) * w / 2, (1 - v[1] / v[3]) * h / 2] : null; };
    ctx.font = `${12 * dpr}px system-ui, sans-serif`; ctx.textBaseline = "bottom";
    const label = (p, text, color) => { const s = proj(p); if (!s) return;
      const tw = ctx.measureText(text).width, pad = 4 * dpr;
      ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(s[0] - tw / 2 - pad, s[1] - 18 * dpr, tw + 2 * pad, 16 * dpr);
      ctx.fillStyle = color; ctx.textAlign = "center"; ctx.fillText(text, s[0], s[1] - 3 * dpr); };
    for (const o of (data && data.objects) || [])
      label([o.center_cm[0], o.center_cm[1], Math.max(o.top_cm, 0.5) + 1.5], `[${o.name}] ${o.label}${o.held ? " (held)" : ""}`,
            o.kind === "hand" ? "#ef5350" : (o.held ? "#00dcff" : "#f0b429"));
    label([7.5, 0, 0], "x forward", "#ef5350"); label([0, 7.5, 0], "y left", "#39c07f");

  }

  async function poll() {
    if (!active) return;

        if (!data.version) { npts = 0; version = ""; }

          ? `<b>${npts.toLocaleString()}</b> surface points from <b>${data.views}</b> photo${data.views === 1 ? "" : "s"}`
            + (objs ? `, <b>${objs}</b> listed object${objs === 1 ? "" : "s"} (boxes)` : "")
            + ` &middot; drag to turn, right-drag or shift-drag to move, scroll to zoom &middot; grid 5 cm, blue outline = reach`

  }

  // mouse: orbit / pan / zoom
  let drag = null;
  glc.addEventListener("contextmenu", (e) => e.preventDefault());
  glc.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey };
    glc.setPointerCapture(e.pointerId); });
  glc.addEventListener("pointerup", () => { drag = null; });
  glc.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      const k = cam.dist * 0.0018, f = norm(sub(cam.target, eye())), s = norm(cross(f, [0, 0, 1])), u = cross(s, f);

    } else {

    }

  });
  glc.addEventListener("wheel", (e) => { e.preventDefault(); cam.dist = Math.max(8, Math.min(250, cam.dist * Math.exp(e.deltaY * 0.001))); redraw(); },
                       { passive: false });
  const reset = () => { cam = { ...HOME, target: [...HOME.target] }; redraw(); };
  glc.addEventListener("dblclick", reset);
  $("mapreset").addEventListener("click", reset);
  $("mapcolor").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
    for (const x of $("mapcolor").children) x.classList.toggle("on", x === b); colorMode = b.dataset.v === "height" ? 1 : 0; redraw(); });
  new ResizeObserver(redraw).observe(wrap);

  return {
    show() { if (active) return; active = true; wrap.classList.add("show"); clearTimeout(timer); poll(); redraw(); },
    hide() { active = false; wrap.classList.remove("show"); clearTimeout(timer); },
  };
})();
function setCamView(v) {
  for (const x of $("camview").children) x.classList.toggle("on", x.dataset.v === v);
  document.querySelector(".feed .overlay").style.display = v === "map" ? "none" : "";
  if (v === "map") { map3d.show(); return; }

}
// Server-sent state; reconnects automatically if the server restarts.
function connect() {
  const es = new EventSource("/api/events");
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(connect, 1000); };
}
connect();
if (location.hash === "#map") setCamView("map");  // open straight on the 3D map
</script>
