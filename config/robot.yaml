# Hardware config for the SO-101 on this laptop. Paths are relative to config/.
arm:
  # Stable by-id path (survives replug); /dev/ttyACM0 also works.
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AB0158804-if00
  calibration_file: calibration/so101_follower.json
  max_speed_deg_s: 45
  # Per-joint correction vs the URDF (urdf_deg = raw_deg - offset). From known-pose checks on
  # 2026-11-25: pose A (zero) read elbow 12.7, pose B (tip down) needed 11.2 to be vertical.
  joint_offsets_deg:
    elbow_flex: 11.5
  # Parallel-jaw gripper (roboninecom SO-ARM100-101-102-Parallel-Gripper) reads max ticks when closed.
  gripper_inverted: true
  # Optional soft limits (deg) overriding the defaults in hardware/so101.py.
  joint_limits_deg: {}

tool:
  # Fingertip centre (jaws closed) in the gripper_link frame, from the parallel gripper CAD
  # (assets/so101/assets/parallel_gripper). Agrees with pose B (tip touching the table: 13.2 cm).
  # The URDF's stock tool point sits 8 mm off the wrist-roll axis; the parallel jaws close on it.
  tip_xyz_m: [0.0, 0.0, -0.1318]
  # Gap between the jaws at 100 % opening (range_min tick 2260): 1760 ticks on a ~8.5 mm pitch-radius
  # pinion, both clamps moving. Estimate from the CAD gear; measure to confirm.
  gripper_open_gap_m: 0.046

# Allowed grasp/target region in the base frame (m). +x forward, +y = arm's left, z = 0 is the table.
# Every perception-derived target is checked against this before the arm moves.
workspace:
  x: [0.10, 0.32]
  y: [-0.20, 0.20]
  z: [0.0, 0.25]

camera:
  device: /dev/v4l/by-id/usb-5MP_USB_Camera_5MP_USB_Camera_01.00.00-video-index0
  # 4:3 keeps the whole fisheye circle (16:9 modes crop it). 2592x1944 was tried for more pixels on the
  # phone board but the camera dropped off USB repeatedly (2026-11-25); 1600x1200 has been stable.
  width: 1600
  height: 1200
  fps: 20

# Episode recording (src/so101_zero_shot/recording.py): every run on the arm is saved as
# runs/<run>/episode.parquet (wrist frames + joint state/load/commands by timestamp) + episode.json (task,
# outcome). 10 Hz at 800x600 JPEG is about 0.5-0.9 MB/s (~60 MB for a 90 s grasp).
recording:
  enabled: true
  fps: 10
  image_width: 800   # raw frames are 1600x1200; stored resized (aspect kept), intrinsics scaled in episode.json
  jpeg_quality: 85

# Named joint poses (deg, URDF convention): [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll].
poses:
  # Folded on its stops reads about [-2.5, -108, 90, 48, -2.5]; hold a few deg off the stops.
  rest: [0.0, -104.0, 84.0, 50.0, 0.0]
  # Tip ~16 cm above table, 23 cm out, fingers/camera tilted 45 deg forward. All joints >= 19 deg from limits.
  scan: [0.0, -50.0, 10.0, 85.0, 0.0]

# Calibration board shown full screen on a phone lying flat on the table (scripts/make_charuco.py --phone,
# docs/calibration/charuco_phone.png). Physical size depends on the phone, so square_mm must be measured:
# long edge of the board (6 squares) in mm / 6. null = not measured yet; calibration refuses to run.
calibration_board:
  cols: 4
  rows: 6
  square_mm: 14.767   # caliper 2026-11-25: 6 squares = 88.6 mm (single square 14.7 mm)
  marker_ratio: 0.75   # marker side / square side
  dictionary: DICT_5X5_100

# Phase 2 perception (all local). Images are rectified from the fisheye to a pinhole view first; the
# calibrated lens model is trustworthy to ~49 deg off-axis, so hfov 100 deg stays inside it.
perception:
  vlm_model: Qwen/Qwen3-VL-2B-Instruct   # smallest that grounds well; 4B is the fallback if pointing fails
  sam_model: facebook/sam2.1-hiera-small
  depth_model: depth-anything/Depth-Anything-V2-Small-hf
  rectified_size: [960, 720]
  rectified_hfov_deg: 100.0
  table_z_m: 0.0   # the base sits on the table
